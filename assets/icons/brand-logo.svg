<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <!-- Symbol Icon: Geometric Anvil & Ascending Growth Chevron -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="url(#logoGrad)" />
    <!-- Rising Forge Chevron Pattern -->
    <path d="M12 28 L20 18 L28 28" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 28 L20 22 L24 28" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="13" r="2.5" fill="#F59E0B"/>
  </g>
  
  <!-- Wordmark Text -->
  <text x="56" y="24" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5" fill="currentColor">
    CAPITAL<tspan fill="#2563EB">FORGE</tspan>
  </text>
  <text x="56" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2.2" fill="#64748B">
    COMMERCIAL FINANCE
  </text>

  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B192C"/>
      <stop offset="0.6" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
</svg>
