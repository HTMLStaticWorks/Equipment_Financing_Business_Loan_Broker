<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070D14"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="40%" stop-color="#0D9488"/>
      <stop offset="80%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  <g stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="160" x2="720" y2="160"/>
    <line x1="80" y1="240" x2="720" y2="240"/>
    <line x1="80" y1="320" x2="720" y2="320"/>
    <line x1="80" y1="400" x2="720" y2="400"/>

    <line x1="160" y1="60" x2="160" y2="420"/>
    <line x1="300" y1="60" x2="300" y2="420"/>
    <line x1="440" y1="60" x2="440" y2="420"/>
    <line x1="580" y1="60" x2="580" y2="420"/>
    <line x1="720" y1="60" x2="720" y2="420"/>
  </g>

  <!-- Area Gradient Fill -->
  <path d="M 100 380 Q 220 370, 300 290 T 500 210 T 700 110 L 700 420 L 100 420 Z" fill="url(#areaGrad)"/>

  <!-- Growth Curve Line -->
  <path d="M 100 380 Q 220 370, 300 290 T 500 210 T 700 110" fill="none" stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Secondary Target Line -->
  <path d="M 100 395 C 240 370, 380 340, 520 280 S 660 190, 700 160" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 6" opacity="0.45"/>

  <!-- Data Nodes -->
  <g fill="#0F172A" stroke-width="3">
    <!-- Node 1: Inception -->
    <circle cx="100" cy="380" r="7" stroke="#2563EB" fill="#FFFFFF"/>
    <!-- Node 2: Equipment Acquisition -->
    <circle cx="300" cy="290" r="7" stroke="#0D9488" fill="#FFFFFF"/>
    <!-- Node 3: Working Capital Inject -->
    <circle cx="500" cy="210" r="8" stroke="#10B981" fill="#FFFFFF"/>
    <!-- Node 4: Peak Expansion -->
    <circle cx="700" cy="110" r="9" stroke="#F59E0B" fill="#FFFFFF"/>
  </g>

  <!-- Callout Tooltip at Peak -->
  <g transform="translate(560, 45)">
    <rect width="165" height="52" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" filter="url(#glow)"/>
    <text x="14" y="22" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#94A3B8">FUNDING ACCELERATION</text>
    <text x="14" y="42" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">+240% Growth Cap</text>
  </g>

  <!-- Timeline Labels -->
  <text x="100" y="445" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Step 1: Inquiry</text>
  <text x="300" y="445" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Step 2: Equip</text>
  <text x="500" y="445" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Step 3: Optimize</text>
  <text x="700" y="445" font-family="'Inter', sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Step 4: Scale</text>
</svg>
